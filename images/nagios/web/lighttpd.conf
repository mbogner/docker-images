server.modules = (
    "mod_alias",
    "mod_redirect",
    "mod_auth",
    "mod_authn_file",
    "mod_cgi",
    "mod_setenv",
)

# CGIs only get the request environment, pass the container timezone for displayed dates
setenv.add-environment = ( "TZ" => env.TZ )

server.port          = 8080
server.document-root = "/opt/nagios/share"
server.pid-file      = "/tmp/lighttpd.pid"
server.errorlog      = "/dev/stderr"
server.upload-dirs   = ( "/tmp" )
index-file.names     = ( "index.php", "index.html" )

url.redirect = ( "^/$" => "/nagios/" )

# longest prefix first
alias.url = (
    "/nagios/cgi-bin/" => "/opt/nagios/sbin/",
    "/nagios/"         => "/opt/nagios/share/",
)

cgi.assign = (
    ".cgi" => "",
    ".php" => "/usr/bin/php-cgi",
)

auth.backend                 = "htpasswd"
auth.backend.htpasswd.userfile = "/opt/nagios/etc/htpasswd.users"
auth.require = (
    "/nagios/" => (
        "method"  => "basic",
        "realm"   => "Nagios Access",
        "require" => "valid-user",
    ),
)
